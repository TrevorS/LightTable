name: app

# Builds, checks and packages Light Table on every platform it ships for.
#
# Reusable rather than standalone so that `build.yml` (every push) and
# `release.yml` (a tag) run exactly the same steps. The alternative — a second
# workflow that duplicates these — is how a release comes out different from
# what CI has been proving for months.
#
# The matrix is the point. Almost everything platform-specific in this project
# lives in the last two steps: which Electron binary is downloaded, where it is
# cached, whether a virtual display is needed, and the plist patching and
# codesigning that only macOS does. None of that was covered before, and all of
# it has broken at least once.

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the packaged application as a workflow artifact.
        type: boolean
        default: false
      version:
        description: >-
          Override the version in the release name. Empty means take it from
          deploy/core/package.json, which is what a normal build does.
        type: string
        default: ''

jobs:
  app:
    strategy:
      # One platform failing should not hide the state of the other: a macOS
      # packaging bug and a Linux compile error are different problems.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            electron-cache: ~/.cache/electron
          - os: macos-latest
            platform: mac
            electron-cache: ~/Library/Caches/electron

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/core/package-lock.json
            deploy/electron/package-lock.json
            plugins/Javascript/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn', 'package-lock.json') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Install build tooling
        run: npm ci

      - name: Install core dependencies
        working-directory: deploy/core
        run: npm ci

      # Compiled first: the smoke test boots the real main process.
      # Everything that needs neither a display nor a build, first: a lint or
      # type error should not cost a ClojureScript compile to discover. Both
      # linters run in about two seconds.
      # Also confirms doc/api still matches the docstrings it was generated
      # from: it is committed, so nothing else would notice it going stale.
      - name: Lint, type-check, and check the generated API docs
        run: npm run check

      - name: Type-check and build the main process
        run: npm run build:main

      # The window's own TypeScript, required by lt.objs.sidebar.command and
      # lt.objs.tabs, so it has to exist before the smoke test boots. The
      # worker's is bundled into worker.js, and the browser client is served to
      # connecting pages; both are wanted before anything runs too.
      - name: Type-check and build the window, worker and browser modules
        run: |
          npm run build:window
          npm run build:worker
          npm run build:browser

      # ClojureScript under node, and the main process under plain node.
      # Both are seconds and need nothing assembled, so a failure here
      # explains an integration failure rather than being explained by one.
      - name: Unit tests
        run: npm test

      # The plugins are in this repository, so nothing is fetched for them and
      # nothing is cached: they are built from source by the Compile and Build
      # in-tree plugins steps below, like the editor. There is no binary left
      # in plugins/ to cache — the Clojure plugin's nREPL server is the user's
      # own Leiningen now, not a downloaded uberjar.

      # shadow-cljs exits non-zero when compilation fails, but warnings alone do
      # not fail it, so the job has to read the output. The build is warning
      # free, so the bar is simply zero — no allowance, no classes to exempt.
      # -a because shadow colours its output, so the log is not plain text.
      - name: Compile
        run: |
          set -o pipefail
          npm run build:cljs 2>&1 | tee build.log
          count=$(grep -ac 'WARNING #' build.log || true)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count ClojureScript warning(s)"
            grep -a -A6 'WARNING #' build.log
            exit 1
          fi

      # Plugins that live in this repository. Built against the editor, so a
      # rename here fails the build rather than a user's session.
      - name: Build in-tree plugins
        run: npm run build:plugins

      # The failures this project actually hits are load-time and cross-process
      # ones, which only show up in the assembled app.
      # Electron 43 dropped the postinstall that used to fetch the binary, so
      # `npm ci` brings down the package and nothing else. Without the second
      # step there is no dist/ and the smoke test cannot boot anything.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('deploy/electron/package-lock.json') }}

      - name: Install Electron
        working-directory: deploy/electron
        run: |
          npm ci
          npx --no-install install-electron

      # Linux runners have no display at all. macOS runners do, and Electron
      # talks to the window server directly, so there is nothing to install
      # there; script/smoke-test.sh works that out for itself.
      - name: Install a virtual display
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Smoke test
        run: script/smoke-test.sh

      # The real application, one instance per test file, driven through both
      # halves — see doc/testing.md. This is the layer that can see a window
      # other than the first one, which is where the blank-window bug lived.
      - name: Integration tests
        run: npm run test:e2e

      - name: Keep the report from a failing integration run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.platform }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Packaged on every run, not only for releases. This is where the
      # platform differences actually live — the Info.plist patching, the
      # inner-out codesigning, the launcher rename — and a packaging bug that
      # only surfaces at release time is a packaging bug found at the worst
      # possible moment. It costs about a minute.
      - name: Package the application
        env:
          VERSION: ${{ inputs.version }}
        run: script/build-app.sh --release

      - name: Name the archive
        id: archive
        run: |
          set -e
          name=$(node -p "require('./deploy/core/package.json').name")
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=$(node -p "require('./deploy/core/package.json').version")
          echo "file=$name-$version-${{ matrix.platform }}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la builds/

      - name: Upload the packaged application
        if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.file }}
          path: builds/${{ steps.archive.outputs.file }}
          if-no-files-found: error
          # Already a compressed archive; zipping it again buys nothing.
          compression-level: 0

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/core/package-lock.json
            deploy/electron/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('shadow-cljs.edn', 'package-lock.json') }}
          restore-keys: m2-

      - name: Install build tooling
        run: npm ci

      - name: Install core dependencies
        working-directory: deploy/core
        run: npm ci

      # Compiled first: the smoke test boots the real main process.
      # Everything that needs neither a display nor a build, first: a lint or
      # type error should not cost a ClojureScript compile to discover. Both
      # linters run in about two seconds.
      - name: Lint and type-check
        run: npm run check

      - name: Type-check and build the main process
        run: npm run build:main

      # The window's own TypeScript, required by lt.objs.sidebar.command and
      # lt.objs.tabs, so it has to exist before the smoke test boots. The
      # worker's is bundled into worker.js, and the browser client is served to
      # connecting pages; both are wanted before anything runs too.
      - name: Type-check and build the window, worker and browser modules
        run: |
          npm run build:window
          npm run build:worker
          npm run build:browser

      - name: Unit tests
        run: |
          npx shadow-cljs compile test
          node target/test.js

      # The two published flagships, at the versions script/build.sh pins. They
      # are here rather than skipped because they are what the plugin require
      # shim exists for: the Clojure plugin's nREPL client wants net, Buffer
      # and bencode, and the Javascript plugin loads a CommonJS package it
      # vendored. Without them the smoke test still passes and checks nothing
      # about either. Shallow clones — neither one's history is wanted.
      #
      # Before the build, and cached by directory rather than by
      # deploy/plugins as a whole. Both matter. deploy/plugins also holds the
      # in-tree plugins, which script/place-plugins.js writes during the build;
      # a cache covering the parent restored a stale Paredit *over* the fresh
      # one, and a ClojureScript module compiled against a different bundle
      # fails at load with `cljs$cst$NNN is not defined`, because those
      # constants are numbered per compilation. Running the fetch first means
      # the build always has the last word either way.
      - name: Cache the published plugins
        uses: actions/cache@v4
        with:
          path: |
            deploy/plugins/Clojure
            deploy/plugins/Javascript
          key: plugins-Clojure-0.3.3-Javascript-0.2.0

      - name: Fetch the published plugins
        run: |
          mkdir -p deploy/plugins
          for spec in Clojure,0.3.3 Javascript,0.2.0; do
            name="${spec%%,*}"; version="${spec##*,}"
            [ -d "deploy/plugins/$name" ] && continue
            git clone --quiet --depth 1 --branch "$version" \
              "https://github.com/LightTable/$name" "deploy/plugins/$name"
          done
          ls deploy/plugins

      # shadow-cljs exits non-zero when compilation fails, but warnings alone do
      # not fail it, so the job has to read the output. The build is warning
      # free, so the bar is simply zero — no allowance, no classes to exempt.
      # -a because shadow colours its output, so the log is not plain text.
      - name: Compile
        run: |
          set -o pipefail
          npm run build:cljs 2>&1 | tee build.log
          count=$(grep -ac 'WARNING #' build.log || true)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count ClojureScript warning(s)"
            grep -a -A6 'WARNING #' build.log
            exit 1
          fi

      # Plugins that live in this repository. Built against the editor, so a
      # rename here fails the build rather than a user's session.
      - name: Build in-tree plugins
        run: npm run build:plugins

      # The failures this project actually hits are load-time and cross-process
      # ones, which only show up in the assembled app.
      # Electron 43 dropped the postinstall that used to fetch the binary, so
      # `npm ci` brings down the package and nothing else. Without the second
      # step there is no dist/ and the smoke test cannot boot anything.
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('deploy/electron/package-lock.json') }}

      - name: Install Electron
        working-directory: deploy/electron
        run: |
          npm ci
          npx --no-install install-electron

      - name: Smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y xvfb
          script/smoke-test.sh

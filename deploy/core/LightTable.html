<html>
  <head>
    <meta charset='utf-8'>
    <title>
      Light Table
    </title>
    <link type="text/css" rel="stylesheet" href="css/reset.css"></link>
    <link type="text/css" rel="stylesheet" href="css/structure.css"></link>
    <!-- Tree-sitter capture names as token classes. Before the theme rather
         than after: themes are injected into the head at runtime, so anything
         here is the default and a theme overrides it by arriving later. -->
    <link type="text/css" rel="stylesheet" href="css/treesitter.css">
    <!-- The component kit's token sheet. After treesitter.css and before any
         skin, so a skin can still override a role — see doc/rendering.md. -->
    <link type="text/css" rel="stylesheet" href="css/kit.css"></link>
    <style>
      html, body { background: #3b3f41; color:#ccc; height:100vh; width:100vw;}
      #loader { position:absolute; top:0; left:0; right:0; bottom:0; width:100vw; height:100vh; display:table; text-align:center; box-sizing:border-box; vertical-align:middle;}
      #loader p { display:table-cell; vertical-align:middle; text-align:center; }
    </style>
  </head>
  <body tabindex="-1">
    <div id="loader">
        <p>
            <img src="img/lighttabletextdark.png" width="40%"/>
        </p>
    </div>
    <div id="wrapper" style="opacity:0;">
    </div>
    <script src="lighttable/util/keyevents.js" type="text/javascript"> </script>
    <script type="text/javascript">
        // Say it on the page. Until the editor raises :show nothing is visible
        // but this loader, so a failure before that point left a dark screen
        // with a logo on it and the reason in a developer console the released
        // app does not open. "It's just white" is what that looks like to the
        // person it happens to, and it is not enough to go on.
        function bootFailed(what, e) {
            console.error(what, e);
            var loader = document.getElementById("loader");
            if (!loader) return;
            var said = document.createElement("pre");
            said.style.cssText = "margin:0;padding:40px;text-align:left;" +
                "font:13px/1.6 monospace;white-space:pre-wrap;overflow:auto;height:100vh;" +
                "box-sizing:border-box;";
            said.textContent = "Light Table could not start.\n\n" + what + "\n\n" +
                ((e && (e.stack || e.message)) || String(e)) +
                "\n\nThis is usually an incomplete or mismatched build.";
            loader.style.display = "block";
            loader.replaceChildren(said);
        }

        var script = document.createElement("script");
        script.type = "text/javascript";
        script.async = false;
        script.src= "lighttable/bootstrap.js";
        script.onerror = function () {
            // Nothing else reports this one: onload never fires, so without it
            // the loader simply stays up forever.
            bootFailed("lighttable/bootstrap.js did not load.", "The file is missing or unreadable.");
        };
        script.onload = function() {
            try {
                lt.objs.app.init();
            } catch (e) {
                bootFailed("lt.objs.app.init() threw.", e);
            }
        }
        document.body.appendChild(script);
    </script>
</body>
</html>
